name: Staging E2E

run-name: Staging E2E · ${{ inputs.candidate_ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Reviewed Sovereign Mail commit or ref to validate
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: sovereign-mail-staging-e2e
  cancel-in-progress: false

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    environment: sovereign-mail-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SOVEREIGN_MAIL_E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SOVEREIGN_MAIL_E2E_CLOUDFLARE_API_TOKEN }}
      SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_ID: ${{ secrets.SOVEREIGN_MAIL_E2E_ACCESS_CLIENT_ID }}
      SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.SOVEREIGN_MAIL_E2E_ACCESS_CLIENT_SECRET }}
      SOVEREIGN_MAIL_STAGING_EMAIL_DOMAIN: ${{ secrets.SOVEREIGN_MAIL_E2E_EMAIL_DOMAIN }}
      SOVEREIGN_MAIL_STAGING_OWNER_EMAIL: ${{ secrets.SOVEREIGN_MAIL_E2E_OWNER_EMAIL }}
      SOVEREIGN_MAIL_STAGING_OWNER_PASSWORD: ${{ secrets.SOVEREIGN_MAIL_E2E_OWNER_PASSWORD }}
      SOVEREIGN_MAIL_STAGING_OAUTH_CLIENT_ID: ${{ vars.SOVEREIGN_MAIL_E2E_OAUTH_CLIENT_ID }}
      SOVEREIGN_MAIL_STAGING_SENDER: hello@${{ secrets.SOVEREIGN_MAIL_E2E_EMAIL_DOMAIN }}
      SOVEREIGN_MAIL_STAGING_URL: https://${{ secrets.SOVEREIGN_MAIL_E2E_APP_HOSTNAME }}
      DEPLOYMENT_NAME: e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-playwright-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create disposable customer resources
        run: >-
          pnpm sovereign-mail install
          --name "$DEPLOYMENT_NAME"
          --worker-name sovereign-mail-e2e-staging
          --domain "$SOVEREIGN_MAIL_STAGING_EMAIL_DOMAIN"
          --no-email
          --app-domain "${SOVEREIGN_MAIL_STAGING_URL#https://}"
          --auth-url "$SOVEREIGN_MAIL_STAGING_URL"
          --oauth-mode customer
          --oauth-client-id "$SOVEREIGN_MAIL_STAGING_OAUTH_CLIENT_ID"
          --skip-build
          --skip-deploy
      - name: Deploy reviewed source candidate
        run: |
          config=".sovereign-mail/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          AUTH_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$AUTH_SECRET"
          echo "SOVEREIGN_MAIL_STAGING_AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          AUTH_SECRET="$AUTH_SECRET" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import webpush from "web-push";
            const vapid = webpush.generateVAPIDKeys();
            writeFileSync("/tmp/sovereign-mail-e2e-secrets.json", `${JSON.stringify({
              BETTER_AUTH_SECRET: process.env.AUTH_SECRET,
              VAPID_PUBLIC_KEY: vapid.publicKey,
              VAPID_PRIVATE_KEY: vapid.privateKey
            })}\n`, { mode: 0o600 });
          '
          pnpm build
          pnpm exec wrangler d1 migrations apply DB --remote --config "$config"
          pnpm exec wrangler deploy --config "$config" --secrets-file /tmp/sovereign-mail-e2e-secrets.json
      - name: Wait for the disposable custom domain
        run: |
          for attempt in $(seq 1 150); do
            if curl --fail --silent --show-error \
              -H "CF-Access-Client-Id: $SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_SECRET" \
              "$SOVEREIGN_MAIL_STAGING_URL/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Disposable Sovereign Mail custom domain was not healthy within 300 seconds"
          exit 1
      - name: Verify PWA, app shell, access, and operator lifecycle
        run: pnpm test:e2e:staging
      - name: Exercise populated remote backup and restore
        run: |
          config=".sovereign-mail/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          database="sovereign-mail-$DEPLOYMENT_NAME"
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "INSERT INTO app_settings (key, value_json, created_at, updated_at) VALUES ('staging-restore-probe', '{\"state\":\"before\"}', datetime('now'), datetime('now'))"
          pnpm sovereign-mail backup --name "$DEPLOYMENT_NAME" --output /tmp/sovereign-mail-backup.json
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "UPDATE app_settings SET value_json = '{\"state\":\"after\"}', updated_at = datetime('now') WHERE key = 'staging-restore-probe'"
          pnpm sovereign-mail restore --name "$DEPLOYMENT_NAME" --backup /tmp/sovereign-mail-backup.json --yes
          result=$(pnpm exec wrangler d1 execute "$database" --remote --config "$config" --json \
            --command "SELECT value_json FROM app_settings WHERE key = 'staging-restore-probe'")
          jq -e '.[0].results[0].value_json == "{\"state\":\"before\"}"' <<<"$result"
      - name: Upload non-secret deployment record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sovereign-mail-staging-manifest-${{ github.run_id }}
          path: .sovereign-mail/deployments/e2e-${{ github.run_id }}/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Destroy disposable resources
        if: always()
        run: pnpm sovereign-mail destroy --name "$DEPLOYMENT_NAME" --scope all --yes
