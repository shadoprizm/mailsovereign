name: Signed Sovereign Mail release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-mail-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      draft_created: ${{ steps.draft.outputs.created }}
      previous_tag: ${{ steps.metadata.outputs.previous_tag }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-not-used-in-production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve and validate committed release metadata
        id: metadata
        run: |
          test "$GITHUB_REF_NAME" = "main"
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = "PUBLIC" || {
            echo "Sovereign Mail must be public before a release can start." >&2
            exit 1
          }
          release_version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(packageJson.version)) {
              throw new Error("package.json version must be semantic.");
            }
            process.stdout.write(packageJson.version);
          ')"
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if gh release view "v${release_version}" >/dev/null 2>&1; then
            echo "Release v${release_version} already exists." >&2
            exit 1
          fi
          if test -n "$previous_tag"; then
            PREVIOUS_VERSION="${previous_tag#v}" RELEASE_VERSION="$release_version" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
              const parts = (value) => value.split("-")[0].split(".").map(Number);
              const compare = (left, right) => {
                const a = parts(left);
                const b = parts(right);
                for (let index = 0; index < 3; index += 1) {
                  if (a[index] !== b[index]) return a[index] - b[index];
                }
                return 0;
              };
              if (compare(process.env.RELEASE_VERSION, process.env.PREVIOUS_VERSION) <= 0) {
                throw new Error("The committed version must be newer than the latest stable release.");
              }
              if (compare(process.env.PREVIOUS_VERSION, packageJson.sovereignMailRelease.minimumVersion) < 0) {
                throw new Error("The previous stable release is below the candidate minimumVersion.");
              }
            '
          fi
          artifact_name="sovereign-mail-release-${release_version}-${GITHUB_SHA}"
          echo "SOVEREIGN_MAIL_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm deploy:dry-run
      - name: Verify signing key
        env:
          SOVEREIGN_MAIL_RELEASE_PRIVATE_KEY: ${{ secrets.SOVEREIGN_MAIL_RELEASE_PRIVATE_KEY }}
        run: test -n "$SOVEREIGN_MAIL_RELEASE_PRIVATE_KEY"
      - name: Package and sign candidate
        env:
          SOVEREIGN_MAIL_RELEASE_PRIVATE_KEY: ${{ secrets.SOVEREIGN_MAIL_RELEASE_PRIVATE_KEY }}
        run: pnpm release:package
      - name: Extract release notes
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const version = process.env.SOVEREIGN_MAIL_RELEASE_VERSION;
            const changelog = readFileSync("CHANGELOG.md", "utf8");
            const start = changelog.indexOf(`## ${version}\n`);
            if (start < 0) throw new Error(`Missing changelog entry for ${version}`);
            const bodyStart = start + `## ${version}\n`.length;
            const next = changelog.indexOf("\n## ", bodyStart);
            const body = changelog.slice(bodyStart, next < 0 ? undefined : next).trim();
            writeFileSync("release/notes.md", `${body}\n`);
          '
      - name: Preserve the exact candidate for staging
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Create draft GitHub Release
        id: draft
        run: |
          gh release create "v${SOVEREIGN_MAIL_RELEASE_VERSION}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Sovereign Mail ${SOVEREIGN_MAIL_RELEASE_VERSION}" \
            --notes-file release/notes.md \
            "release/sovereign-mail-${SOVEREIGN_MAIL_RELEASE_VERSION}.tar.gz" \
            "release/sovereign-mail-${SOVEREIGN_MAIL_RELEASE_VERSION}.sha256" \
            "release/manifest-${SOVEREIGN_MAIL_RELEASE_VERSION}.json" \
            "release/stable.json"
          echo "created=true" >> "$GITHUB_OUTPUT"

  staging:
    needs: candidate
    runs-on: ubuntu-latest
    environment: sovereign-mail-staging
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      PREVIOUS_TAG: ${{ needs.candidate.outputs.previous_tag }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SOVEREIGN_MAIL_E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SOVEREIGN_MAIL_E2E_CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_ID: ${{ secrets.SOVEREIGN_MAIL_E2E_ACCESS_CLIENT_ID }}
      SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.SOVEREIGN_MAIL_E2E_ACCESS_CLIENT_SECRET }}
      SOVEREIGN_MAIL_STAGING_EMAIL_DOMAIN: ${{ secrets.SOVEREIGN_MAIL_E2E_EMAIL_DOMAIN }}
      SOVEREIGN_MAIL_STAGING_OWNER_EMAIL: ${{ secrets.SOVEREIGN_MAIL_E2E_OWNER_EMAIL }}
      SOVEREIGN_MAIL_STAGING_OWNER_PASSWORD: ${{ secrets.SOVEREIGN_MAIL_E2E_OWNER_PASSWORD }}
      SOVEREIGN_MAIL_STAGING_OAUTH_CLIENT_ID: ${{ vars.SOVEREIGN_MAIL_E2E_OAUTH_CLIENT_ID }}
      SOVEREIGN_MAIL_STAGING_SENDER: hello@${{ secrets.SOVEREIGN_MAIL_E2E_EMAIL_DOMAIN }}
      SOVEREIGN_MAIL_STAGING_URL: https://${{ secrets.SOVEREIGN_MAIL_E2E_APP_HOSTNAME }}
      DEPLOYMENT_NAME: release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-playwright-
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: release
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create disposable customer resources
        run: >-
          pnpm sovereign-mail install
          --name "$DEPLOYMENT_NAME"
          --worker-name sovereign-mail-e2e-staging
          --domain "$SOVEREIGN_MAIL_STAGING_EMAIL_DOMAIN"
          --no-email
          --app-domain "${SOVEREIGN_MAIL_STAGING_URL#https://}"
          --auth-url "$SOVEREIGN_MAIL_STAGING_URL"
          --oauth-client-id "$SOVEREIGN_MAIL_STAGING_OAUTH_CLIENT_ID"
          --skip-build
          --skip-deploy
      - name: Generate disposable authentication secret
        run: |
          auth_secret="$(openssl rand -base64 48)"
          echo "::add-mask::$auth_secret"
          echo "SOVEREIGN_MAIL_STAGING_AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
      - name: Download and deploy the previous stable release
        if: needs.candidate.outputs.previous_tag != ''
        run: |
          mkdir -p /tmp/sovereign-mail-previous
          gh release download "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern stable.json \
            --pattern 'sovereign-mail-*.tar.gz' \
            --dir /tmp/sovereign-mail-previous
          previous_version="${PREVIOUS_TAG#v}"
          previous_archive="/tmp/sovereign-mail-previous/sovereign-mail-${previous_version}.tar.gz"
          config=".sovereign-mail/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          SOVEREIGN_MAIL_AUTH_SECRET="$SOVEREIGN_MAIL_STAGING_AUTH_SECRET" \
          SOVEREIGN_MAIL_EXPECTED_RELEASE_VERSION="$previous_version" \
          SOVEREIGN_MAIL_RELEASE_ARTIFACT_FILE="$previous_archive" \
          SOVEREIGN_MAIL_RELEASE_MANIFEST_FILE="/tmp/sovereign-mail-previous/stable.json" \
          WORKERS_CI=1 \
            node scripts/release/deploy.mjs --config "$config"
      - name: Wait for the previous stable release
        if: needs.candidate.outputs.previous_tag != ''
        run: |
          for attempt in $(seq 1 150); do
            if curl --fail --silent --show-error \
              -H "CF-Access-Client-Id: $SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_SECRET" \
              "$SOVEREIGN_MAIL_STAGING_URL/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Previous stable Sovereign Mail was not healthy within 300 seconds"
          exit 1
      - name: Bootstrap persistent N-1 staging data
        if: needs.candidate.outputs.previous_tag != ''
        run: pnpm test:e2e:staging:lifecycle
      - name: Apply the exact signed candidate
        run: |
          pnpm sovereign-mail oauth \
            --name "$DEPLOYMENT_NAME" \
            --mode customer \
            --auth-url "$SOVEREIGN_MAIL_STAGING_URL" \
            --client-id "$SOVEREIGN_MAIL_STAGING_OAUTH_CLIENT_ID" \
            --skip-deploy
          config=".sovereign-mail/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          SOVEREIGN_MAIL_AUTH_SECRET="$SOVEREIGN_MAIL_STAGING_AUTH_SECRET" \
          SOVEREIGN_MAIL_EXPECTED_RELEASE_VERSION="$CANDIDATE_VERSION" \
          SOVEREIGN_MAIL_RELEASE_ARTIFACT_FILE="release/sovereign-mail-${CANDIDATE_VERSION}.tar.gz" \
          SOVEREIGN_MAIL_RELEASE_MANIFEST_FILE="release/stable.json" \
          WORKERS_CI=1 \
            node scripts/release/deploy.mjs --config "$config"
      - name: Wait for the signed candidate
        run: |
          for attempt in $(seq 1 150); do
            if curl --fail --silent --show-error \
              -H "CF-Access-Client-Id: $SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $SOVEREIGN_MAIL_STAGING_ACCESS_CLIENT_SECRET" \
              "$SOVEREIGN_MAIL_STAGING_URL/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Signed Sovereign Mail candidate was not healthy within 300 seconds"
          exit 1
      - name: Verify the installed candidate release marker
        run: |
          config=".sovereign-mail/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          database="sovereign-mail-$DEPLOYMENT_NAME"
          result="$(pnpm exec wrangler d1 execute "$database" --remote --config "$config" --json \
            --command "SELECT installed_version FROM release_state WHERE singleton = 1")"
          jq -e --arg version "$CANDIDATE_VERSION" \
            '.[0].results[0].installed_version == $version' <<<"$result"
      - name: Verify PWA, app shell, access, and operator lifecycle
        run: pnpm test:e2e:staging
      - name: Exercise populated remote backup and restore
        run: |
          config=".sovereign-mail/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          database="sovereign-mail-$DEPLOYMENT_NAME"
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "INSERT INTO app_settings (key, value_json, created_at, updated_at) VALUES ('staging-restore-probe', '{\"state\":\"before\"}', datetime('now'), datetime('now'))"
          pnpm sovereign-mail backup --name "$DEPLOYMENT_NAME" --output /tmp/sovereign-mail-backup.json
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "UPDATE app_settings SET value_json = '{\"state\":\"after\"}', updated_at = datetime('now') WHERE key = 'staging-restore-probe'"
          pnpm sovereign-mail restore --name "$DEPLOYMENT_NAME" --backup /tmp/sovereign-mail-backup.json --yes
          result="$(pnpm exec wrangler d1 execute "$database" --remote --config "$config" --json \
            --command "SELECT value_json FROM app_settings WHERE key = 'staging-restore-probe'")"
          jq -e '.[0].results[0].value_json == "{\"state\":\"before\"}"' <<<"$result"
      - name: Upload non-secret deployment record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sovereign-mail-release-staging-manifest-${{ github.run_id }}
          path: .sovereign-mail/deployments/release-${{ github.run_id }}/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Destroy disposable resources
        if: always()
        run: pnpm sovereign-mail destroy --name "$DEPLOYMENT_NAME" --scope all --yes

  publish:
    needs: [candidate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOVEREIGN_MAIL_RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Publish the validated draft
        run: gh release edit "v${SOVEREIGN_MAIL_RELEASE_VERSION}" --draft=false --latest
      - name: Verify public stable asset, signature, and digest
        run: |
          stable_url="https://github.com/shadoprizm/mailsovereign/releases/latest/download/stable.json"
          artifact_url="https://github.com/shadoprizm/mailsovereign/releases/download/v${SOVEREIGN_MAIL_RELEASE_VERSION}/sovereign-mail-${SOVEREIGN_MAIL_RELEASE_VERSION}.tar.gz"
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error "$stable_url" --output /tmp/stable.json &&
               curl --fail --location --silent --show-error "$artifact_url" --output /tmp/sovereign-mail.tar.gz; then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done
          node --input-type=module -e '
            import { createHash, createPublicKey, verify } from "node:crypto";
            import { readFileSync, statSync } from "node:fs";
            const version = process.env.SOVEREIGN_MAIL_RELEASE_VERSION;
            const config = JSON.parse(readFileSync("config/product.json", "utf8"));
            const envelope = JSON.parse(readFileSync("/tmp/stable.json", "utf8"));
            const key = createPublicKey({
              key: Buffer.from(config.releasePublicKey, "base64"),
              format: "der",
              type: "spki"
            });
            if (!verify(null, Buffer.from(envelope.payload, "base64url"), key, Buffer.from(envelope.signature, "base64url"))) {
              throw new Error("Published stable manifest signature is invalid.");
            }
            const manifest = JSON.parse(Buffer.from(envelope.payload, "base64url").toString("utf8"));
            if (manifest.product !== "sovereign-mail" || manifest.version !== version) {
              throw new Error("Published stable manifest identity is invalid.");
            }
            const bytes = readFileSync("/tmp/sovereign-mail.tar.gz");
            if (createHash("sha256").update(bytes).digest("hex") !== manifest.artifact.sha256 ||
                statSync("/tmp/sovereign-mail.tar.gz").size !== manifest.artifact.size) {
              throw new Error("Published artifact does not match the signed manifest.");
            }
          '

  cleanup-failed-draft:
    needs: [candidate, staging]
    if: ${{ always() && needs.candidate.outputs.draft_created == 'true' && needs.staging.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove the failed draft
        run: >-
          gh release delete "v${{ needs.candidate.outputs.version }}"
          --repo "${{ github.repository }}"
          --yes
